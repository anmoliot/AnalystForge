name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analystforge
          POSTGRES_PASSWORD: analystforge_test
          POSTGRES_DB: analystforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports: ["1025:1025", "8025:8025"]
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://analystforge:analystforge_test@localhost:5432/analystforge_test
      TEST_DATABASE_URL: postgresql+asyncpg://analystforge:analystforge_test@localhost:5432/analystforge_test
      REDIS_URL: redis://localhost:6379/0
      LOG_JSON: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - name: Generate ephemeral test signing key
        run: python -c "import os,secrets; open(os.environ['GITHUB_ENV'],'a').write('SECRET_KEY='+secrets.token_hex(32)+'\n')"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy strict (quant)
        run: uv run mypy packages/quant/src
      - name: Version and generated API reference
        run: |
          uv run python scripts/check_version.py
          uv run python scripts/generate_api_docs.py
          git diff --exit-code -- docs/API.md
      - name: Migrations
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Mailpit delivery integration
        run: uv run python scripts/verify_mailpit.py --smtp-port 1025 --http-port 8025
      - name: Pytest
        run: uv run pytest --cov=analystforge.quant --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  web:
    name: Web lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/web
        run: npm audit --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: infra/docker/api.Dockerfile
          - image: web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: analystforge-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: analystforge-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: trivy.json
          scanners: vuln
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trivy-${{ matrix.image }}
          path: trivy.json

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Compose stack
        run: |
          umask 077
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text(f'SECRET_KEY={secrets.token_hex(32)}\nPOSTGRES_PASSWORD={secrets.token_hex(24)}\n')
          PY
          docker compose up --build --detach --wait --wait-timeout 240
      - name: Check API dependencies and web response through Nginx
        run: |
          curl -fsS http://127.0.0.1:8080/ready | jq -e '.status == "ready" and all(.checks[]; .status == "ok")'
          curl -fsS -D "$RUNNER_TEMP/web-headers" http://127.0.0.1:8080/ -o "$RUNNER_TEMP/index.html"
          grep -qi 'content-security-policy:' "$RUNNER_TEMP/web-headers"
          grep -q 'id="root"' "$RUNNER_TEMP/index.html"
      - if: always()
        run: docker compose down --volumes

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv export --locked --all-packages --no-emit-workspace --no-hashes -o "$RUNNER_TEMP/dependencies.txt"
      - run: uvx --python 3.12 pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/dependencies.txt" -f json -o pip-audit.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: python-advisories
          path: pip-audit.json

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Scan Python application sources
        run: |
          uvx --from bandit==1.9.4 bandit -r apps/api/src apps/worker/src packages/providers/src packages/quant/src packages/sdk-python/src -f json -o bandit.json --exit-zero
          python -c "import json,sys; r=json.load(open('bandit.json')); sys.exit(bool(r['errors']) or any(f['issue_severity']=='HIGH' for f in r['results']))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit
          path: bandit.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact --log-opts=--all /repo

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analystforge
          POSTGRES_PASSWORD: analystforge_test
          POSTGRES_DB: analystforge_e2e_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://analystforge:analystforge_test@localhost:5432/analystforge_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-packages --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            docs/screenshots/wp10-*.png

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-packages --python 3.12
      - uses: grafana/setup-k6-action@v1
      - name: Run smoke profile against isolated database
        run: |
          uv run python tests/e2e/server.py &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          curl --retry 60 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8765/health
          k6 run tests/load/smoke.js
          mkdir -p "$RUNNER_TEMP/zap"
          sudo chown 1000 "$RUNNER_TEMP/zap"
          docker run --rm --network host \
            -v "$PWD/tests/security/zap.yaml:/zap/plan.yaml:ro" \
            -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap.sh -cmd -autorun /zap/plan.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-passive
          path: ${{ runner.temp }}/zap/report.html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: k6-smoke
          path: smoke.json
