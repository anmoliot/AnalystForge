[project]
name = "analystforge-api"
version = "0.1.0"
description = "AnalystForge FastAPI application"
requires-python = ">=3.12"
dependencies = [
  "analystforge-quant",
  "analystforge-providers",
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "redis>=5.2.1",
  "arq>=0.26.3",
  "croniter>=6.0.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.1",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "sentry-sdk>=2.19.2",
  "PyJWT>=2.10.1",
  "argon2-cffi>=23.1.0",
  "cryptography>=44.0.0",
  "pyotp>=2.9.0",
  "qrcode[pil]>=8.0",
  "python-multipart>=0.0.20",
  "email-validator>=2.2.0",
  "httpx>=0.28.1",
  "tenacity>=9.0.0",
  "anthropic>=0.42.0",
  "pgvector>=0.3.6",
  "pypdf>=5.1.0",
  "reportlab>=4.2.5",
  "python-pptx>=1.0.2",
  "openpyxl>=3.1.5",
  "xlsxwriter>=3.2.0",
  "jinja2>=3.1.5",
  "python-dateutil>=2.9.0.post0",
  "numpy>=2.1.0",
  "pandas>=2.2.3",
]

[project.optional-dependencies]
ai = [
  "sentence-transformers>=3.3.1",
  "transformers>=4.48.0",
  "torch>=2.5.0",
]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
  "freezegun>=1.5.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
