[project]
name = "analystforge-worker"
version = "0.1.0"
description = "AnalystForge background worker and schedulers"
requires-python = ">=3.12"
dependencies = [
  "analystforge-api",
  "arq>=0.26.3",
  "structlog>=24.4.0",
  "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
