[project]
name = "analystforge-quant"
version = "0.1.0"
description = "Pure, unit-tested quantitative finance library for AnalystForge (no I/O, no web, no DB)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1.0",
  "pandas>=2.2.3",
  "scipy>=1.14.1",
  "statsmodels>=0.14.4",
  "cvxpy>=1.6.0",
  "arch>=7.2.0",
  "openpyxl>=3.1.5",
  "xlsxwriter>=3.2.0",
  "pyseccomp>=0.1.2,<0.2 ; sys_platform == 'linux'",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analystforge = ["py.typed"]
