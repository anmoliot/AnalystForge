env:
  contexts:
    - name: local-test-api
      urls:
        - http://127.0.0.1:8765
  parameters:
    failOnError: true
    failOnWarning: true
jobs:
  - type: requestor
    requests:
      - url: http://127.0.0.1:8765/health
        responseCode: 200
      - url: http://127.0.0.1:8765/api/v1/meta
        responseCode: 200
      - url: http://127.0.0.1:8765/docs
        responseCode: 200
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: report.html
  - type: exitStatus
    parameters:
      errorLevel: High
      warnLevel: High
